[package]
name = "memory-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
blake3 = "1.8.6"
gcp_auth = "0.12.7"
ort = "2.0.0-rc.13"
pulldown-cmark = "0.13.4"
regex = "1.13.1"
rmcp = { version = "3.1.2", features = ["transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sqlite-vec = "0.1.9"
tokenizers = "0.23.1"
tokio = { version = "1.53.1", default-features = false, features = ["full"] }
ureq = { version = "2", features = ["json"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
